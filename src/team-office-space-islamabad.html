<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-slot="title"></title>
  <meta name="description" data-slot="description" content="">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="%SITE_URL%/team-office-space-islamabad">
  <meta property="og:type" content="website">
  <meta property="og:url" content="%SITE_URL%/team-office-space-islamabad">
  <meta property="og:title" data-slot="og_title" content="">
  <meta property="og:description" data-slot="og_description" content="">
  <meta name="twitter:title" data-slot="twitter_title" content="">
  <meta name="twitter:description" data-slot="twitter_description" content="">
<!-- include:head -->
  <link rel="preload" as="image" href="/assets/img/team-office.jpg" data-sizes="(max-width: 960px) calc(100vw - 48px), 590px" fetchpriority="high">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": "%SITE_URL%/" },
          { "@type": "ListItem", "position": 2, "name": "Team office space", "item": "%SITE_URL%/team-office-space-islamabad" }
        ]
      },
      {
        "@type": "Service",
        "name": "Team office space in E-11, Islamabad",
        "serviceType": "Team office space rental",
        "url": "%SITE_URL%/team-office-space-islamabad",
        "image": "%SITE_URL%/assets/img/team-office-1200.jpg",
        "areaServed": { "@type": "City", "name": "Islamabad" },
        "provider": { "@type": "LocalBusiness", "@id": "%SITE_URL%/#business", "name": "CoNinja Coworking", "telephone": "+923275393390", "address": { "@type": "PostalAddress", "streetAddress": "1st Floor, Professional Arcade, MPCHS E-11/3", "addressLocality": "Islamabad", "postalCode": "44000", "addressCountry": "PK" } },
        "offers": { "@type": "Offer", "priceCurrency": "PKR", "price": "14000", "priceSpecification": { "@type": "UnitPriceSpecification", "price": "14000", "priceCurrency": "PKR", "unitText": "per seat per month" } }
      },
      {
        "@type": "FAQPage",
        "mainEntity": [
          %FAQ_JSONLD%
        ]
      }
    ]
  }
  </script>
</head>
<body>
<!-- include:sprite -->
<!-- include:nav -->

  <main id="main">
    <section class="lp-hero">
      <div class="container lp-hero__grid">
        <div>
          <nav aria-label="Breadcrumb"><ol class="crumbs caption-2"><li><a href="/">Home</a></li><li aria-current="page">Team office space</li></ol></nav>
          <h1 data-slot="h1" class="heading-1">%SLOT% <span data-slot="h1_accent" class="violet"></span></h1>
          <p data-slot="lead" class="lp-hero__sub body-3 muted"></p>
          <div class="lp-price">
            <span data-slot="hero_price_label" class="price-tag caption-3"></span>
            <p data-slot="hero_price_amount" class="heading-4 num"></p>
            <p data-slot="hero_price_note" class="caption-5 muted"></p>
          </div>
          <div class="hero__cta">
            <a data-slot="hero_button" class="btn btn--lg button-md" href="/?space=Team%20space#tour"></a>
            <a class="link body-5" href="https://wa.me/923275393390?text=Hi%20CoNinja%2C%20I'd%20like%20to%20ask%20about%20team%20space." target="_blank" rel="noopener">Or WhatsApp <span class="num nowrap">0327 5393390</span><svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></a>
          </div>
        </div>
        <figure class="lp-hero__photo">
          <img src="/assets/img/team-office.jpg" data-sizes="(max-width: 960px) calc(100vw - 48px), 590px" alt="Team office space in E-11 Islamabad with rows of desks and chairs" width="1200" height="1600" fetchpriority="high" decoding="async">
        </figure>
      </div>
    </section>

    <section class="section">
      <div class="container join">
        <div class="reveal">
          <p data-slot="cost_label" class="label caption-1"></p>
          <h2 data-slot="cost_heading" class="heading-3"></h2>
          <p data-slot="cost_text_1" class="body-3 muted mt-200"></p>
        </div>
        <div class="hours reveal" data-calc data-rate="14000">
          <label class="field" for="calc-seats">
            <span class="caption-1">Team size: <strong class="title-3" data-calc-seats>20</strong> people</span>
            <input id="calc-seats" type="range" min="20" max="40" step="1" value="20" data-calc-input>
          </label>
          <p class="heading-3 num mt-300" aria-live="polite"><span data-calc-total>PKR 280,000</span></p>
          <p data-slot="cost_text_2" class="caption-2 faint"></p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head reveal">
          <p data-slot="included_label" class="label caption-1"></p>
          <h2 data-slot="included_heading" class="heading-2"></h2>
        </div>
        <ul class="facility-list">
          <li class="facility reveal"><span class="facility__icon"><svg class="icon" aria-hidden="true"><use href="#i-wifi-high"/></svg></span><div><h3 data-slot="included_item_1_title" class="title-2"></h3><p data-slot="included_item_1_text" class="body-6 muted"></p></div></li>
          <li class="facility reveal"><span class="facility__icon"><svg class="icon" aria-hidden="true"><use href="#i-lightning"/></svg></span><div><h3 data-slot="included_item_2_title" class="title-2"></h3><p data-slot="included_item_2_text" class="body-6 muted"></p></div></li>
          <li class="facility reveal"><span class="facility__icon"><svg class="icon" aria-hidden="true"><use href="#i-snowflake"/></svg></span><div><h3 data-slot="included_item_3_title" class="title-2"></h3><p data-slot="included_item_3_text" class="body-6 muted"></p></div></li>
          <li class="facility reveal"><span class="facility__icon"><svg class="icon" aria-hidden="true"><use href="#i-coffee"/></svg></span><div><h3 data-slot="included_item_4_title" class="title-2"></h3><p data-slot="included_item_4_text" class="body-6 muted"></p></div></li>
          <li class="facility reveal"><span class="facility__icon"><svg class="icon" aria-hidden="true"><use href="#i-presentation"/></svg></span><div><h3 data-slot="included_item_5_title" class="title-2"></h3><p data-slot="included_item_5_text" class="body-6 muted"></p></div></li>
          <li class="facility reveal"><span class="facility__icon"><svg class="icon" aria-hidden="true"><use href="#i-fork-knife"/></svg></span><div><h3 data-slot="included_item_6_title" class="title-2"></h3><p data-slot="included_item_6_text" class="body-6 muted"></p></div></li>
          <li class="facility reveal"><span class="facility__icon"><svg class="icon" aria-hidden="true"><use href="#i-security-camera"/></svg></span><div><h3 data-slot="included_item_7_title" class="title-2"></h3><p data-slot="included_item_7_text" class="body-6 muted"></p></div></li>
          <li class="facility reveal"><span class="facility__icon"><svg class="icon" aria-hidden="true"><use href="#i-car"/></svg></span><div><h3 data-slot="included_item_8_title" class="title-2"></h3><p data-slot="included_item_8_text" class="body-6 muted"></p></div></li>
        </ul>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head reveal">
          <p data-slot="compare_label" class="label caption-1"></p>
          <h2 data-slot="compare_heading" class="heading-2"></h2>
          <p data-slot="compare_text" class="body-3 muted measure"></p>
        </div>
        <div class="compare-wrap reveal">
          <table class="compare body-6">
            <thead><tr><th data-slot="compare_col_1" scope="col" class="title-4"></th><th data-slot="compare_col_2" scope="col" class="title-4"></th><th data-slot="compare_col_3" scope="col" class="title-4"></th></tr></thead>
            <tbody>
              <tr><th data-slot="compare_row_1_label" scope="row" class="title-4"></th><td data-slot="compare_row_1_col_1"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>%SLOT%</td><td data-slot="compare_row_1_col_2"></td></tr>
              <tr><th data-slot="compare_row_2_label" scope="row" class="title-4"></th><td data-slot="compare_row_2_col_1"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>%SLOT%</td><td data-slot="compare_row_2_col_2"></td></tr>
              <tr><th data-slot="compare_row_3_label" scope="row" class="title-4"></th><td data-slot="compare_row_3_col_1"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>%SLOT%</td><td data-slot="compare_row_3_col_2"></td></tr>
              <tr><th data-slot="compare_row_4_label" scope="row" class="title-4"></th><td data-slot="compare_row_4_col_1"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>%SLOT%</td><td data-slot="compare_row_4_col_2"></td></tr>
              <tr><th data-slot="compare_row_5_label" scope="row" class="title-4"></th><td data-slot="compare_row_5_col_1"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>%SLOT%</td><td data-slot="compare_row_5_col_2"></td></tr>
              <tr><th data-slot="compare_row_6_label" scope="row" class="title-4"></th><td data-slot="compare_row_6_col_1"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>%SLOT%</td><td data-slot="compare_row_6_col_2"></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container faq">
        <div class="faq__head reveal">
          <p data-slot="faq_label" class="label caption-1"></p>
          <h2 data-slot="faq_heading" class="heading-3"></h2>
        </div>
        <dl class="faq__list">
          <div class="faq__item reveal"><dt data-slot="faq_1_q" class="title-2"></dt><dd data-slot="faq_1_a" class="body-3 muted"></dd></div>
          <div class="faq__item reveal"><dt data-slot="faq_2_q" class="title-2"></dt><dd data-slot="faq_2_a" class="body-3 muted"></dd></div>
          <div class="faq__item reveal"><dt data-slot="faq_3_q" class="title-2"></dt><dd data-slot="faq_3_a" class="body-3 muted"></dd></div>
          <div class="faq__item reveal"><dt data-slot="faq_4_q" class="title-2"></dt><dd data-slot="faq_4_a" class="body-3 muted"></dd></div>
          <div class="faq__item reveal"><dt data-slot="faq_5_q" class="title-2"></dt><dd data-slot="faq_5_a" class="body-3 muted"></dd></div>
          <div class="faq__item reveal"><dt data-slot="faq_6_q" class="title-2"></dt><dd data-slot="faq_6_a" class="body-3 muted"></dd></div>
        </dl>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="cta-band reveal">
          <div>
            <h2 data-slot="cta_heading" class="heading-4"></h2>
            <p data-slot="cta_text" class="body-3 muted mt-200"></p>
          </div>
          <div class="cta-band__actions">
            <a data-slot="cta_button" class="btn btn--light btn--lg button-md" href="/?space=Team%20space#tour"></a>
            <a data-slot="cta_link" class="link body-5" href="/#spaces">%SLOT%<svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></a>
          </div>
        </div>
      </div>
    </section>
  </main>

<!-- include:footer -->
</body>
</html>
